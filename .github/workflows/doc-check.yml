name: Doc Check

# MOD-specific: not tracked by the scaffold sync. scaffold-drift.yml dispatches
# only the scaffold's workflows, so this does not run on a drift PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  doc-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install build dependencies for Lua
      run: sudo apt-get update && sudo apt-get install -y libreadline-dev

    - name: Setup mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

    - name: Check function doc comments
      run: mise run doc-check

    - name: Run the doc-check fixture test
      run: bash tools/doc_check_test.sh
