[mod-name]
quidquid=Quidquid

[mod-description]
quidquid=アイテム・レシピ・テクノロジーなどをインクリメンタルに検索できる多目的パレットです。選んだ対象に応じた操作をそのまま行え、拡張modで検索対象と操作を増やせます。

[controls]
quidquid-open-palette=パレットを開く
quidquid-craft-1=1個製作
quidquid-add-to-research-queue=研究予約に追加
quidquid-open-remote-view=リモートビューで開く
quidquid-craft-5=5個製作
quidquid-craft-all=可能な数全て製作
quidquid-open-factoriopedia=検索結果をファクトリオペディアで開く
quidquid-temporary-request=臨時物流要求を作成
quidquid-temporary-request-editor-confirm=臨時物流要求を確定
quidquid-pipette=ピペットツール
quidquid-palette-up=前の検索結果を選択
quidquid-palette-down=次の検索結果を選択

[mod-setting-name]
quidquid-include-hidden=検索結果に非表示の項目を含める

[mod-setting-description]
quidquid-include-hidden=ゲーム側で表に出ない項目も検索結果に含めます(非表示に指定されたプロトタイプや、テクノロジー画面に表示されないアップグレードの段階など)。未解放・未研究の項目はこの設定に関係なく表示されます。

